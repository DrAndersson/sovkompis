name: Test and publish Sovkompis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and test progress rules
        working-directory: sovkompis
        run: |
          node --check dist/app.js
          node --check dist/avatar.js
          node --check dist/demo-3d.js
          node --check dist/rig-3d.js
          node --check dist/appearance-3d.js
          node --check dist/motion-3d.js
          node --check dist/equipment-3d.js
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sovkompis/dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
